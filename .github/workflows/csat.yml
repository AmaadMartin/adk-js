
name: 'CSAT survey ADK JS'
on:
  issues:
    types:
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v3
      - uses: actions/github-script@v6
        with:
          script: |
            const script = require('./.github/scripts/csat.cjs')
            script({github, context})
