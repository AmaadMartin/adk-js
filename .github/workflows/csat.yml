
name: 'CSAT survey ADK JS'
on:
  issues:
    types:
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/csat.cjs')
            script({github, context})
