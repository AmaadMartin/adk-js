name: validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  run-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24.x']
        include:
          # The exact lower bound of engines.node in core/dev/integrations
          # package.json. Pinned to the patch so a Node API added later in the
          # 20.x line cannot pass CI while breaking a consumer who is still
          # inside the declared range. Keep the two in sync.
          - os: ubuntu-latest
            node: '20.19.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Check for secrets leaks
        run: npx secretlint "**/*"

      - name: Build packages
        run: npm run build

      - name: Run tests and check code coverage
        run: npm run test:coverage

      - name: Run lint check
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Run documentation build check
        run: npm run docs:check
