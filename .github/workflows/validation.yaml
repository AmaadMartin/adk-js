name: validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  run-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Check for secrets leaks
        run: npx secretlint "**/*"

      - name: Build packages
        run: npm run build

      - name: Run tests and check code coverage
        run: npm run test:coverage

      - name: Run lint check
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Run documentation build check
        run: npm run docs:check

  audit-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6

      # `npm audit` resolves the tree from package-lock.json, so this job needs
      # no install. `--omit=dev` limits the report to the dependencies we
      # publish, so a devDependency advisory cannot show up on a pull request.
      #
      # This check reports; it does not gate. `npm audit` has no way to
      # acknowledge a finding, so a blocking gate would fail every open pull
      # request the moment a new advisory lands against a dependency we already
      # ship. See CONTRIBUTING.md ("Dependency audit") for the conditions under
      # which this becomes blocking.
      #
      # `set -o pipefail` is load-bearing: without it `tee` returns 0 and the
      # summary below claims a clean tree over a report full of findings.
      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high | tee "${RUNNER_TEMP}/audit.log"

      # `outcome` is the result before `continue-on-error` absorbs it;
      # `conclusion` is always `success` here.
      - name: Publish audit report
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo '## Production dependency audit'
            echo
            if [ "${AUDIT_OUTCOME}" = 'success' ]; then
              echo 'No high or critical advisories in the production dependency tree.'
            else
              echo 'npm audit reported high or critical advisories, or could not run.'
              echo 'This check is advisory and does not block merging.'
            fi
            echo
            echo '```'
            cat "${RUNNER_TEMP}/audit.log" || echo '(no audit output captured)'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
