name: validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  run-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Pinned because setup-node otherwise leaves each runner image on its own
      # default: ubuntu and windows ship Node 22 while macos ships Node 24, and
      # the two V8 versions emit different coverage ranges for identical test
      # runs, which is what made npm run test:coverage disagree across the legs.
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Check for secrets leaks
        run: npx secretlint "**/*"

      - name: Build packages
        run: npm run build

      - name: Run tests and check code coverage
        run: npm run test:coverage

      # Uploaded even when the threshold check fails the step above: that is
      # exactly when the per-leg report is wanted. Without this the report is
      # written to the gitignored coverage/ directory and discarded, so a leg
      # reporting different totals from its siblings cannot be investigated.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/coverage-final.json
          retention-days: 7

      - name: Run lint check
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Run documentation build check
        run: npm run docs:check
