name: validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  run-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Check for secrets leaks
        run: npx secretlint "**/*"

      - name: Build packages
        run: npm run build

      - name: Run tests and check code coverage
        run: npm run test:coverage

      - name: Run lint check
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Run documentation build check
        run: npm run docs:check

  check-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Pinned deliberately: npm's lockfile serialization changes between npm
      # majors, so an unpinned Node would make this check fail on runner image
      # upgrades rather than on real lockfile drift.
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check package-lock.json is in sync with the workspace manifests
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --exit-code -- package-lock.json; then
            echo "::error::package-lock.json is out of sync with the package.json files. Run 'npm install --package-lock-only' locally and commit the updated lockfile."
            exit 1
          fi
