name: conformance

# Replays the adk-python conformance fixtures against this branch.
#
# Separate from the main test job on purpose. It answers a different question
# -- "does this behave like adk-python" rather than "is this correct" -- and it
# should be able to fail without blocking a change that is right on its own
# terms while parity is still being built up.
#
# Pushes only, deliberately. On `pull_request` this would add a job to every
# one of the 800-odd open pull requests on the fork the day it lands, to prove
# something about a branch none of them target. Running it on the integration
# branch answers the parity question once per pass, which is the cadence the
# question actually changes at. Widen the trigger when it has been green and
# fast for a while, not before.
on:
  push:
    branches: [experimental]

jobs:
  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Pinned and bare, matching validation.yaml. The first version of this
      # job pinned a node version and enabled npm caching, and `npm ci` then
      # failed the run with a registry 401 while every other workflow on the
      # repo installed fine. Copy what works here rather than rediscovering
      # why it works.
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0

      - name: Install dependencies
        run: npm install

      # No build step: the config aliases @google/adk to core/src, so the
      # replay runs against the sources the branch actually carries.
      - name: Replay adk-python conformance fixtures
        run: npx vitest run --config conformance/vitest.conformance.ts
