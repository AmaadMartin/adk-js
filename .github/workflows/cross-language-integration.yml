name: Cross-Language Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # runner.temp is only readable from a step context, so both steps that
      # need the prefetch directory declare it themselves.
      - name: Prefetch the sqlite3 prebuilt binary
        run: node scripts/prefetch_sqlite3_prebuild.mjs
        env:
          npm_config_sqlite3_local_prebuilds: ${{ runner.temp }}/sqlite3-prebuilds

      - name: Install dependencies
        run: npm install
        env:
          npm_config_sqlite3_local_prebuilds: ${{ runner.temp }}/sqlite3-prebuilds

      - name: Install Go dependencies
        shell: bash
        run: |
          (cd tests/cross_language/a2a/go_ts/go_client && go mod tidy)
          (cd tests/cross_language/a2a/ts_go/go_backend && go mod tidy)

      - name: Build packages
        run: npm run build

      - name: Run cross-language integration tests
        run: npm run test:cross-language
