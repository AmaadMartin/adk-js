name: Cross-Language Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: npm install

      - name: Install Go dependencies
        shell: bash
        # `go mod download` verifies each module against the committed go.sum
        # and never writes it. `go mod tidy` rewrites go.sum, which would hide
        # dependency drift from the `go run` in the test step.
        run: |
          (cd tests/cross_language/a2a/go_ts/go_client && go mod download)
          (cd tests/cross_language/a2a/ts_go/go_backend && go mod download)

      - name: Build packages
        run: npm run build

      - name: Run cross-language integration tests
        run: npm run test:cross-language
