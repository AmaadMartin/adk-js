# Keeps the GitHub Actions in .github/workflows and the npm dependency tree up to date.
# Schema: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: 'github-actions'
    # For this ecosystem '/' means "scan .github/workflows", not the repo root.
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # Collapse every action bump into one PR per week instead of one per action.
      github-actions:
        patterns:
          - '*'
    commit-message:
      # 'chore' prefix so release-please treats bumps as non-releasable.
      prefix: 'chore(deps)'
  - package-ecosystem: 'npm'
    # The root manifest and package-lock.json; the workspace members are reached from here.
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # Minor and patch bumps land as one PR a week; majors stay individual so a
      # breaking bump cannot hold back the safe ones.
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'chore(deps)'
