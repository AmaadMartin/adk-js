# Keeps the GitHub Actions in .github/workflows, the npm dependency tree and the
# cross-language Go test modules up to date.
# Schema: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: 'github-actions'
    # For this ecosystem '/' means "scan .github/workflows", not the repo root.
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # Collapse every action bump into one PR per week instead of one per action.
      github-actions:
        patterns:
          - '*'
    commit-message:
      # 'chore' prefix so release-please treats bumps as non-releasable.
      prefix: 'chore(deps)'
  - package-ecosystem: 'npm'
    # The root manifest and package-lock.json; the workspace members are reached from here.
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # Minor and patch bumps land as one PR a week; majors stay individual so a
      # breaking bump cannot hold back the safe ones.
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: 'gomod'
    # Both cross-language test modules on one entry, so a module they share is
    # bumped in both at once instead of one at a time.
    directories:
      - '/tests/cross_language/a2a/go_ts/go_client'
      - '/tests/cross_language/a2a/ts_go/go_backend'
    schedule:
      interval: 'weekly'
    allow:
      # Both go.mod files pin their transitive modules explicitly, and that is
      # where they drifted; the default of direct requirements only misses them.
      - dependency-type: 'all'
    groups:
      go-modules:
        # One PR per module, spanning both directories.
        group-by: dependency-name
    commit-message:
      prefix: 'chore(deps)'
